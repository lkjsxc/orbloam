name: Verify Orbloam
on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - 'dist/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'start.sh'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'project/**'
      - 'dist/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'start.sh'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire pinned official runtime
        run: sh tools/install-runtime.sh
      - name: Verify shipped bytes and shell entrypoints
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS)
          sh -n start.sh tools/install-runtime.sh
          python3 -m py_compile tools/*.py tests/*.py
      - name: Check the committed accepted graph and reproduce its artifact
        run: python3 tests/rebuild.py
      - name: Retrieve the exact pre-update artifact for save compatibility
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin 08594a09ca26568d820da1ae9a8a6f38fbed8d79
          git show 08594a09ca26568d820da1ae9a8a6f38fbed8d79:dist/application.lkja > "$RUNNER_TEMP/orbloam-predecessor.lkja"
          printf '%s  %s\n' afd5213d7663e88d0a3fe1a13a1a8946bdd610f3f65279041536a66cae055828 "$RUNNER_TEMP/orbloam-predecessor.lkja" | sha256sum -c -
      - name: Native HTTP, independent oracles, restart and logical recovery
        run: |
          python3 tests/acceptance.py
          python3 tests/catalogue.py
          python3 tests/quiet_native.py --predecessor "$RUNNER_TEMP/orbloam-predecessor.lkja"
          node tests/presentation.mjs
      - name: Offline copied-package boundary and corruption refusal
        run: python3 tests/standalone.py
      - name: Retain this run's verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ github.sha }}
          path: |
            evidence/acceptance.json
            evidence/standalone.json
            evidence/rebuild.json
            evidence/catalogue.json
            evidence/quiet-world/native.json
            evidence/quiet-world/presentation.json
            evidence/quiet-world/native-check.txt
          retention-days: 14
          if-no-files-found: error
