name: Verify Orbloam
on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - 'dist/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'start.sh'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'project/**'
      - 'dist/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'start.sh'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire pinned official runtime
        run: sh tools/install-runtime.sh
      - name: Verify shipped bytes and shell entrypoints
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS)
          sh -n start.sh tools/install-runtime.sh
          python3 -m py_compile tools/*.py tests/*.py
      - name: Check the committed accepted graph and reproduce its artifact
        run: python3 tests/rebuild.py
      - name: Native HTTP, independent oracles, restart and logical recovery
        run: |
          python3 tests/acceptance.py
          python3 tests/catalogue.py
      - name: Offline copied-package boundary and corruption refusal
        run: python3 tests/standalone.py
      - name: Retain this run's verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ github.sha }}
          path: |
            evidence/acceptance.json
            evidence/standalone.json
            evidence/rebuild.json
            evidence/catalogue.json
          retention-days: 14
          if-no-files-found: error
